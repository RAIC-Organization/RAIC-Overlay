[package]
name = "sidecar-rust"
version = "0.1.0"
edition = "2021"
description = "Minimal RAIC Overlay sidecar reference, written in Rust"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "sidecar-rust"
path = "src/main.rs"
